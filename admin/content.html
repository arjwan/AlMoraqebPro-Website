<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة محتوى الأرجوان</title><style>body{font:16px system-ui;background:#f3f4f9;color:#17134f;margin:0;padding:24px}main{max-width:780px;margin:auto}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #c8c9d8;border-radius:9px;font:inherit}button{background:#17134f;color:white;cursor:pointer}article{background:white;border-radius:12px;padding:20px;margin:12px 0}textarea{min-height:160px}</style><main><h1>لوحة محتوى الأرجوان</h1><p>نسخة تطوير تجريبية. يتطلب النشر إعداد CMS_ADMIN_TOKEN وقاعدة D1.</p><label>رمز الإدارة<input id="token" type="password" autocomplete="off"></label><article><h2>موضوع جديد</h2><input id="title" placeholder="العنوان"><textarea id="body" placeholder="الموضوع"></textarea><label>رفع صورة أو فيديو (حتى 20 ميغابايت)<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"></label><button id="upload" type="button">رفع الملف</button><input id="image" type="url" placeholder="رابط صورة HTTPS"><input id="video" type="url" placeholder="رابط فيديو HTTPS"><select id="status"><option value="draft">مسودة</option><option value="published">نشر</option></select><input id="postId" type="hidden"><button id="save">حفظ</button><button id="new" type="button">موضوع جديد / إلغاء التعديل</button></article><article><h2>إدارة البرامج والتطبيقات</h2><input id="productId" type="hidden"><input id="productTitle" placeholder="اسم البرنامج"><textarea id="productDescription" placeholder="وصف البرنامج"></textarea><input id="productPrice" placeholder="السعر أو اتصل بنا"><input id="productUrl" type="url" placeholder="رابط البرنامج أو التحميل HTTPS"><button id="saveProduct" type="button">حفظ البرنامج</button><button id="clearProduct" type="button">برنامج جديد</button><button id="refreshProducts" type="button">عرض البرامج</button><section id="products"></section></article><p id="message" role="status"></p><button id="refresh">عرض المحتوى</button><section id="items"></section></main><script src="/admin/content.js"></script></html>
