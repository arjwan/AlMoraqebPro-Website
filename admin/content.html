<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة محتوى الأرجوان</title><style>body{font:16px system-ui;background:#f3f4f9;color:#17134f;margin:0;padding:24px}main{max-width:780px;margin:auto}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #c8c9d8;border-radius:9px;font:inherit}button{background:#17134f;color:white;cursor:pointer}article{background:white;border-radius:12px;padding:20px;margin:12px 0}textarea{min-height:160px}</style><main><h1>لوحة محتوى الأرجوان</h1><p>نسخة تطوير تجريبية. يتطلب النشر إعداد CMS_ADMIN_TOKEN وقاعدة D1.</p><label>رمز الإدارة<input id="token" type="password" autocomplete="off"></label><article><h2>موضوع جديد</h2><input id="title" placeholder="العنوان"><textarea id="body" placeholder="الموضوع"></textarea><input id="image" type="url" placeholder="رابط صورة HTTPS"><input id="video" type="url" placeholder="رابط فيديو HTTPS"><select id="status"><option value="draft">مسودة</option><option value="published">نشر</option></select><button id="save">حفظ</button></article><p id="message" role="status"></p><button id="refresh">عرض المحتوى</button><section id="items"></section></main><script src="/admin/content.js"></script></html>
