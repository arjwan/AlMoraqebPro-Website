<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخدمات — DEMO</title><link rel="stylesheet" href="mobile.css"></head><body><div class="phone"><div class="top"><span class="demo-badge">DEMO</span><b>خدمات الموظف</b><small>طلبات تجريبية لا تصل للمدير الحقيقي</small></div><div class="content"><div class="card"><h3>طلب إجازة</h3><div class="field"><label>من</label><input id="lf" type="date"></div><div class="field"><label>إلى</label><input id="lt" type="date"></div><div class="field"><label>السبب</label><textarea id="lr"></textarea></div><button class="btn" onclick="saveReq('إجازة',lr.value)">إرسال طلب الإجازة</button></div><div class="card"><h3>طلب سلفة</h3><div class="field"><label>المبلغ</label><input id="amount" type="number" min="1"></div><div class="field"><label>ملاحظة</label><textarea id="note"></textarea></div><button class="btn" onclick="saveReq('سلفة',amount.value+' — '+note.value)">إرسال طلب السلفة</button></div><div id="ok"></div></div><div class="nav"><a href="attendance.html">الحضور</a><a href="services.html">الخدمات</a><a href="requests.html">طلباتي</a></div></div><script>function saveReq(type,details){let r=[];try{r=JSON.parse(sessionStorage.getItem('demoRequests')||'[]')}catch{};r.unshift({type,details,status:'بانتظار الموافقة',at:new Date().toLocaleString('ar-IQ')});sessionStorage.setItem('demoRequests',JSON.stringify(r));ok.className='success';ok.innerHTML='✅ تم إرسال طلبك إلى المدير<br><b>الحالة: بانتظار الموافقة</b><br><small>محاكاة تجريبية فقط — لم يصل الطلب إلى النظام الحقيقي.</small>'}</script></body></html>
